services:
  asr:
    build:
      context: .
      dockerfile: Dockerfile
    image: whispr-asr:cpu
    env_file: .env
    environment:
      MODEL: small.en
      DEVICE: cpu
      COMPUTE: int8
      PORT: "8080"
      DATA_DIR: /data    
            
    volumes:
       - ./asr-data:/data
       - ~/.aws:/root/.aws:ro          
    expose:
      - "8080"                     
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  asr-lb:
    image: haproxy:lts
    depends_on:
      asr:
        condition: service_healthy
    ports:
      - "8080:8080"             
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: unless-stopped
