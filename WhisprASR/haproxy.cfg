global
  maxconn 5000
  log stdout format raw local0

defaults
  mode http
  option httplog
  option logasap
  timeout client  1h
  timeout server  1h
  timeout connect 5s
  timeout http-request 30s

backend asr_pool
  balance roundrobin
  cookie SRV insert indirect nocache
  server-template asr 10 asr:8080 check inter 2s fall 2 rise 2 cookie asr
  option httpchk GET /healthz

frontend asr_ws
  bind *:8080
  acl is_websocket hdr(Upgrade) -i WebSocket
  http-request set-header Connection "upgrade" if is_websocket
  http-request set-header Upgrade "websocket" if is_websocket
  default_backend asr_pool
